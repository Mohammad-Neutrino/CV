name: Compile LaTeX CV
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # Required for pushing later

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV_Type2.tex
          args: "-shell-escape -interaction=nonstopmode -file-line-error"

      - name: Commit PDF
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add CV_Type2.pdf
          git commit -m "Auto-update PDF [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
