name: Compile LaTeX CV
on: [push, workflow_dispatch]

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Compile LaTeX
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error CV_Type2.tex
          ls -la  # Verify PDF exists
          
      - name: Upload PDF
        uses: actions/upload-artifact@v3
        with:
          name: cv-pdf
          path: CV_Type2.pdf
