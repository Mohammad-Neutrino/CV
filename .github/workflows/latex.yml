name: Compile LaTeX CV
on:
  push:
    branches: [ trunk ]
    paths:
      - '**.tex'
      - '**.cls'
      - '**.bib'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: trunk

      - name: Install Full TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full fonts-freefont-otf

      - name: Compile (Phase 1 - Generate References)
        run: |
          pdflatex -shell-escape -interaction=nonstopmode -file-line-error CV_Type2.tex

      - name: Compile (Phase 2 - Final PDF)
        run: |
          pdflatex -shell-escape -interaction=nonstopmode -file-line-error CV_Type2.tex
          [ -f CV_Type2.pdf ] || exit 1

      - name: Commit and Push PDF
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add CV_Type2.pdf
          git commit -m "Auto-update CV PDF" || echo "No changes"
          git push origin HEAD:trunk
        env:
          GITHUB_TOKEN: ${{ secrets.olp_6In9OQnD4C3WrsmbSnR7DWFEGSX6TR16YV2E }}
