name: Compile LaTeX CV
on:
  push:
    branches: [ trunk ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Critical for pushing PDF back
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: trunk  # Explicitly checkout your branch

      - name: Set up PDF Generation
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      - name: Compile LaTeX
        run: |
          pdflatex -shell-escape -interaction=nonstopmode -file-line-error CV_Type2.tex
          [ -f CV_Type2.pdf ] || exit 1  # Fail if PDF not generated

      - name: Commit and Push PDF
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add CV_Type2.pdf
          git commit -m "Auto-generated PDF [skip ci]" || echo "No changes"
          git push origin HEAD:trunk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
