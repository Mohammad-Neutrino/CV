name: Compile LaTeX CV
on: [push, workflow_dispatch]

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4

      # Install exact font packages (common failure point)
      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y \
            fonts-freefont-otf \
            fonts-lmodern \
            fonts-lato \
            fonts-liberation

      # Two-phase compilation with error logging
      - name: Compile LaTeX (Phase 1)
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error \
            -pdflatex="pdflatex -synctex=1 -interaction=nonstopmode -file-line-error" \
            CV_Type2.tex || true
          cat CV_Type2.log | grep -i "error\|warning\|missing"

      - name: Compile LaTeX (Phase 2 - Final)
        run: |
          latexmk -pdf -interaction=nonstopmode -file-line-error CV_Type2.tex
          [ -f CV_Type2.pdf ] || exit 1

      # Upload both PDF and logs for debugging
      - name: Archive Results
        uses: actions/upload-artifact@v3
        with:
          name: compilation-results
          path: |
            CV_Type2.pdf
            CV_Type2.log
